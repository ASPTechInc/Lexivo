# AndroidX is required for modern libraries
android.useAndroidX=true

# R8 full mode is generally recommended for better optimisation
android.r8.strictFullModeForKeepRules=true

# Performance optimisation for large projects
android.dependency.useConstraints=false

# Use Java 17 for Gradle compatibility
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64

# Speed up builds by caching the configuration phase
org.gradle.configuration-cache=true

# Build only one Android ABI in local development to speed up Rust + Gradle builds.
# Set this to true to enable ABI auto-detection or use the 'devAbi' property.
singleAbiDev=true

# Default ABI for local development when auto-detection via ADB is unavailable or unreliable.
# Common values: arm64-v8a (physical devices), x86_64 (emulators/ChromeOS).
devAbi=arm64-v8a
