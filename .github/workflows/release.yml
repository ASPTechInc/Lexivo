# This workflow manages production build and deployment to GitHub Releases
#  when a version tag (e.g. v1.0.0) is pushed to the main. It is triggered by the 'push' event
#  for tags matching 'v*' to the 'main' GitHub branch.
#
# e.g. git tag v1.0.0
#      git push origin v1.0.0
#
name: Create Lexivo release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' # Skip the entire workflow for Dependabot pull requests
    env:
      ANDROID_HOME: ${{ vars.ANDROID_HOME || '/usr/local/lib/android/sdk' }}
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle_home

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Android SDK
        run: |
          echo "Using ANDROID_HOME: $ANDROID_HOME"
          if [ -d "$ANDROID_HOME" ]; then
            echo "SDK directory exists."
            ls -ld "$ANDROID_HOME"
          else
            echo "Error: SDK directory not found at $ANDROID_HOME"
            exit 1
          fi

      - name: Verify tag is on main branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Error: tag $GITHUB_REF_NAME does not point to a commit contained in main."
            exit 1
          fi

      # Build/release steps go here
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Get version from build.gradle
        id: get_version
        run: |
          VERSION=$(grep "versionName =" android/app/build.gradle | awk -F'"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "$VERSION" > version.txt
          echo "Extracted Version: $VERSION"

      - name: Create and populate keystore.properties
        run: |
          echo "storeFile=${{ secrets.KEYSTORE_FILE_NAME }}" > android/app/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/app/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/app/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/app/keystore.properties

      - name: Decode and write keystore file
        run: |
          echo "${{ secrets.KEYSTORE_CONTENT }}" | base64 --decode > android/app/${{ secrets.KEYSTORE_FILE_NAME }}

      - name: Build release APK and bundle
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease -PsingleAbiDev=false --no-daemon
          # Rename outputs to match what the upload steps expect
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Lexivo.apk || cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/Lexivo.apk
          cp app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/Lexivo.aab || cp app/build/outputs/bundle/release/app-release-unsigned.aab app/build/outputs/bundle/release/Lexivo.aab
        working-directory: android
        env:
          GITHUB_TOKEN: ${{ secrets.APP_GITHUB_TOKEN }}

      - name: Upload APK artefact
        if: ${{ !env.ACT }} # Accounts for 'act' not having a ACTIONS_RUNTIME_TOKEN
        uses: actions/upload-artifact@v7
        with:
          name: Lexivo-apk
          path: android/app/build/outputs/apk/release/Lexivo.apk
          retention-days: 1

      - name: Upload bundle artefact
        if: ${{ !env.ACT }} # Accounts for 'act' not having a ACTIONS_RUNTIME_TOKEN
        uses: actions/upload-artifact@v7
        with:
          name: Lexivo-bundle
          path: android/app/build/outputs/bundle/release/Lexivo.aab
          retention-days: 1

      - name: Upload version artefact
        if: ${{ !env.ACT }} # Accounts for 'act' not having a ACTIONS_RUNTIME_TOKEN
        uses: actions/upload-artifact@v7
        with:
          name: version-file
          path: version.txt

  release:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && !github.event.act # Accounts for 'act' not having a ACTIONS_RUNTIME_TOKEN
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download APK artefact
        uses: actions/download-artifact@v8
        with:
          name: Lexivo-apk
          path: ./

      - name: Download bundle artefact
        uses: actions/download-artifact@v8
        with:
          name: Lexivo-bundle
          path: ./

      - name: Download version artefact
        uses: actions/download-artifact@v8
        with:
          name: version-file
          path: ./

      - name: Get version and rename assets
        id: get_version
        run: |
          VERSION=$(cat version.txt)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mv Lexivo.apk Lexivo-v$VERSION.apk
          mv Lexivo.aab Lexivo-v$VERSION.aab

      - name: Create or Update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.VERSION }}
          body: |
            Automatic release generated by GitHub Actions for Lexivo v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            Lexivo-v${{ env.VERSION }}.apk
            Lexivo-v${{ env.VERSION }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          rm -f version.txt
          rm -f Lexivo-v${{ env.VERSION }}.apk
          rm -f Lexivo-v${{ env.VERSION }}.aab
