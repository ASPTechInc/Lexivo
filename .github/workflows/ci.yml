# CI means Continuous Integration.
# This workflow handles Android-specific build pipeline, running
# Gradle tasks like assembleDebug and testDebugUnitTest (which covers Java/Kotlin code).
name: Android CI

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' # Skip the entire workflow for Dependabot pull requests
    env:
      ANDROID_HOME: ${{ vars.ANDROID_HOME || '/usr/local/lib/android/sdk' }}
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle_home

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Android SDK
        run: |
          echo "Using ANDROID_HOME: $ANDROID_HOME"
          if [ -d "$ANDROID_HOME" ]; then
            echo "SDK directory exists."
            ls -ld "$ANDROID_HOME"
          else
            echo "Error: SDK directory not found at $ANDROID_HOME"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Upload Debug APK
        if: ${{ !env.ACT }} # Accounts for 'act' not having a ACTIONS_RUNTIME_TOKEN
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' # Skip the entire workflow for Dependabot pull requests
    env:
      ANDROID_HOME: ${{ vars.ANDROID_HOME || '/usr/local/lib/android/sdk' }}
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle_home
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Android SDK
        run: |
          echo "Using ANDROID_HOME: $ANDROID_HOME"
          if [ -d "$ANDROID_HOME" ]; then
            echo "SDK directory exists."
            ls -ld "$ANDROID_HOME"
          else
            echo "Error: SDK directory not found at $ANDROID_HOME"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon
        working-directory: android

      - name: Upload Test Report
        if: ${{ failure() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' # Skip the entire workflow for Dependabot pull requests
    env:
      ANDROID_HOME: ${{ vars.ANDROID_HOME || '/usr/local/lib/android/sdk' }}
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle_home
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Android SDK
        run: |
          echo "Using ANDROID_HOME: $ANDROID_HOME"
          if [ -d "$ANDROID_HOME" ]; then
            echo "SDK directory exists."
            ls -ld "$ANDROID_HOME"
          else
            echo "Error: SDK directory not found at $ANDROID_HOME"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon
        working-directory: android

      - name: Run Ktlint Check
        run: ./gradlew ktlintCheck
        working-directory: android

      - name: Upload Lint Report
        if: ${{ failure() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
